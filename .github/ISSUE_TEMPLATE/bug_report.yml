name: Bug report / 问题反馈
description: Report a reproducible problem without sharing personal data.
body:
  - type: markdown
    attributes:
      value: Please use synthetic URLs and remove private data from screenshots. For security vulnerabilities, follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Extension, Chrome, and OS versions / 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
