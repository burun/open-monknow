name: Feature request / 功能建议
description: Describe the user problem and a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / 要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives / 建议的行为与替代方案
    validations:
      required: true
