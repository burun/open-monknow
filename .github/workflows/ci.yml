name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: open-monknow-unpacked
          path: dist/open-monknow/
          if-no-files-found: error
